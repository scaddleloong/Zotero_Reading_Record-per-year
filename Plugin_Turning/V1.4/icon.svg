<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Heatmap-inspired background -->
  <rect x="2" y="2" width="44" height="44" rx="9" fill="#0969da"/>
  <!-- Open book body -->
  <rect x="7" y="9" width="34" height="30" rx="2" fill="white"/>
  <!-- Book spine shadow -->
  <line x1="24" y1="9" x2="24" y2="39" stroke="#d0d7de" stroke-width="1.5"/>
  <!-- Left page lines -->
  <line x1="10" y1="17" x2="21" y2="17" stroke="#ebedf0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="10" y1="22" x2="21" y2="22" stroke="#ebedf0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="10" y1="27" x2="18" y2="27" stroke="#ebedf0" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Right page lines -->
  <line x1="27" y1="17" x2="38" y2="17" stroke="#ebedf0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="27" y1="22" x2="38" y2="22" stroke="#ebedf0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="27" y1="27" x2="35" y2="27" stroke="#ebedf0" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Heatmap squares on pages -->
  <rect x="11" y="14" width="5" height="5" rx="1" fill="#9be9a8"/>
  <rect x="17" y="19" width="5" height="5" rx="1" fill="#40c463"/>
  <rect x="28" y="14" width="5" height="5" rx="1" fill="#30a14e"/>
  <rect x="28" y="19" width="5" height="5" rx="1" fill="#216e39"/>
  <rect x="34" y="19" width="5" height="5" rx="1" fill="#40c463"/>
  <rect x="14" y="24" width="5" height="5" rx="1" fill="#30a14e"/>
  <rect x="34" y="24" width="5" height="5" rx="1" fill="#9be9a8"/>
  <!-- Bottom chart wave -->
  <path d="M11 34 Q 15 30 20 34 T 28 31 T 37 35" fill="none" stroke="#0969da" stroke-width="1.5" stroke-linecap="round"/>
</svg>
